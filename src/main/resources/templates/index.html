<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Acesso IoT</title>
    
    <!-- Thymeleaf: Busca CSS na pasta static/css/ -->
    <!-- @{/css/style.css} significa: raiz do projeto + /css/style.css -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header>
            <h1>🚪 Sistema de Controle de Acesso</h1>
            <p class="subtitle">IoT - ESP32 + Spring Boot + Thymeleaf</p>
        </header>

        <main>
            <!-- Painel de Status -->
            <div class="status-panel">
                <div class="status-card">
                    <h2>Status do Ambiente</h2>
                    
                    <div class="status-indicator">
                        <div class="circle" id="statusCircle"></div>
                        <span id="statusText">Carregando...</span>
                    </div>
                    
                    <div class="counters">
                        <div class="counter">
                            <span class="number" id="pessoasPresentes">--</span>
                            <span class="label">Pessoas Presentes</span>
                        </div>
                        <div class="counter">
                            <span class="number" id="limiteMaximo">--</span>
                            <span class="label">Limite Máximo</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botões de Controle -->
            <div class="controls">
                <button class="btn btn-entrada" onclick="registrarEntrada()">
                    <span class="icon">➕</span>
                    <span>Registrar Entrada</span>
                </button>

                <button class="btn btn-saida" onclick="registrarSaida()">
                    <span class="icon">➖</span>
                    <span>Registrar Saída</span>
                </button>
            </div>

            <!-- Painel de Configurações -->
            <div class="config-panel">
                <h3>⚙️ Configurações</h3>
                
                <div class="config-item">
                    <label for="novoLimite">Novo Limite de Pessoas:</label>
                    <input type="number" id="novoLimite" min="1" max="20" value="5">
                    <button class="btn btn-config" onclick="configurarLimite()">
                        Atualizar Limite
                    </button>
                </div>
                
                <button class="btn btn-reset" onclick="resetarSistema()">
                    🔄 Resetar Sistema
                </button>
            </div>

            <!-- Log de Ações -->
            <div class="log-panel">
                <h3>📋 Últimas Ações</h3>
                <div id="logActions" class="log-actions">
                    <p class="log-item">Aguardando ações...</p>
                </div>
            </div>
        </main>

        <!-- Rodapé -->
        <footer>
            <p>Projeto IoT - Controle de Acesso Inteligente</p>
        </footer>
    </div>

    <!-- Thymeleaf: Busca JavaScript na pasta static/js/ -->
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
